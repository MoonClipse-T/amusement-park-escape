<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>루나랜드 — 야간 개장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>

<!-- ============ HUD ============ -->
<div id="hud">
  <div id="clock"><span class="ap">PM</span><span class="hm">07:00</span><span class="left">남은 시간 <b>40:00</b></span></div>
  <div id="objective"><b>할 일</b><span id="objtext">…</span></div>
  <div id="zone"></div>
  <button id="mapBtn" aria-label="지도">지도</button><button id="pauseBtn" aria-label="일시 정지">Ⅱ</button>
  <div id="cross"></div><div id="label"></div>
  <button id="interact" class="rbtn">조사</button><button id="jumpBtn" class="rbtn">점프</button><button id="lightBtn" class="rbtn">손전등</button>
  <div id="stick"><div id="knob"></div></div>
  <div id="hint"></div><div id="toast"></div>
</div>

<!-- 안내 방송 (상단 배너) -->
<div id="pa"><span class="spk">📢</span><span class="lbl">안내 방송</span><span class="txt"></span></div>

<!-- 독백 · 대사 (영화 자막) -->
<div id="mono"><div class="who">나</div><div class="txt"></div><div class="next">▼</div></div>

<!-- 시간 카드 (19:00 / 22:00 / 00:00 …) -->
<div id="card"><div class="bar top"></div><div class="bar bot"></div>
  <div class="inner"><div class="time">19:00</div><div class="title"></div><div class="sub"></div></div></div>

<!-- 공원 안내도 (팸플릿) -->
<div id="map" class="ov"><button class="close">✕</button>
  <div class="pamphlet"><div class="phead"><span>LUNA LAND · 공원 안내도</span><span id="mapTime">PM 07:00</span></div>
  <canvas id="mapcv" width="1000" height="1000"></canvas></div></div>

<!-- 쪽지 · 단서 -->
<div id="msg" class="ov"><div class="note"><i class="tape"></i><h2 id="msgT"></h2><p id="msgP"></p><button id="msgOk">접기</button></div></div>

<!-- 일시 정지 (놀이기구 조작반) -->
<div id="pause" class="ov"><div class="console"><div class="hazard"></div>
  <div class="ctitle">운행 일시 정지<small>OPERATION PAUSED</small></div>
  <p>시계가 멈춰 있습니다.</p>
  <div class="knobs"><button id="resume" class="go"><i></i>계속하기</button><button id="restart" class="stop"><i></i>처음부터</button></div></div></div>

<!-- 실패 : 셔터가 내려온다 -->
<div id="over" class="ov"><div class="shutter"></div>
  <div class="otext"><div class="led">03:00</div><h2 id="overT">…</h2><p id="overP"></p><button id="overRe">다시 입장</button></div></div>

<!-- 탈출 성공 : 새벽 -->
<div id="clear" class="ov"><div class="dawn"></div>
  <div class="ctext"><div class="stamp">EXIT</div><h2>탈출 성공</h2><p id="clearP"></p><button id="clearRe">처음부터</button></div></div>

<!-- 시작 화면 : 해 질 녘 매표소 -->
<div id="start" class="ov on">
  <div class="sky"><i class="sun"></i></div>
  <svg class="skyline" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <g class="wheel" transform="translate(1180 250)">
      <g class="spin">
        <circle r="190" fill="none" stroke="#120d1c" stroke-width="10"/><circle r="150" fill="none" stroke="#120d1c" stroke-width="4"/>
        <g id="spokes" stroke="#120d1c" stroke-width="4"></g><g id="wbulbs"></g>
      </g>
      <path d="M-120 330 L0 0 L120 330 M-80 330 L0 0 L80 330" stroke="#120d1c" stroke-width="12" fill="none"/>
    </g>
    <path d="M0 520 Q120 380 240 470 T480 430 Q560 300 640 460 L700 600 L0 600Z" fill="#120d1c"/>
    <path d="M60 470 L100 470 L100 600 L60 600Z M300 440 L330 440 L330 600 L300 600Z" fill="#120d1c"/>
    <g transform="translate(820 600)"><path d="M-170 0 L-170 -120 L0 -220 L170 -120 L170 0Z" fill="#120d1c"/><path d="M0 -220 L0 -265" stroke="#120d1c" stroke-width="6"/><path d="M0 -265 L34 -255 L0 -245Z" fill="#c8322a"/></g>
    <rect x="0" y="560" width="1600" height="40" fill="#0b0812"/>
  </svg>
  <div class="tcontent">
    <div class="marquee"><div class="bulbs"></div>
      <div class="kicker">LUNA LAND · NIGHT OPENING</div>
      <h1>루나랜드</h1>
      <div class="hours">야간 개장 <b>19:00</b> — 폐장 <b>22:00</b></div></div>
    <p class="tagline">해가 지면 불이 켜지는 놀이공원.<br>폐장 방송이 끝난 뒤에도, 공원은 잠들지 않는다.</p>
    <button class="ticket" id="startBtn">
      <span class="main"><small>NIGHT PASS · 야간 자유이용권</small><strong>1인 입장권</strong><em>No. 0731 · 오늘 19:00 입장</em></span>
      <span class="stub">입장<br><b>▶</b></span>
    </button>
    <div class="guide" id="guide"></div>
  </div>
</div>

<!-- 불러오기 : 입장권 발권 -->
<div id="loading"><div class="slot"></div>
  <div class="paper"><div class="pt">LUNA LAND</div><div class="pl">입장권 발권 중</div><div class="pn" id="lpct">0%</div></div>
  <div class="lmsg" id="lmsg">공원 불을 켜는 중…</div></div>

<div id="fade" class="clear"></div>
<div id="dbg"></div>

<script src="vendor/three.r128.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<!--ASSETS-->
<script src="game.js"></script>
</body>
</html>
